<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nôm Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2d2720">
  <meta name="description" content="Documents in Chữ Nôm, horizontal and vertical.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/prosemirror.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/lang.js"></script>
  <script src="https://qatt.org/js/parser.js"></script>
  <script src="https://qatt.org/js/qatt-text.js"></script>
  <script src="https://qatt.org/js/pa-text.js"></script>
  <script src="/chunom/js/ime.js"></script>
  <script src="https://qatt.org/js/fonts.js"></script>
  <script src="../js/prosemirror.js"></script>
  <script src="js/styles.js"></script>
  <script src="js/core.js"></script>
  <script src="js/db.js"></script>
  <script src="https://qatt.org/vendor/supabase/supabase.min.js"></script>
  <script src="https://qatt.org/js/supabase.js"></script>
  <script src="https://qatt.org/js/login.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/input.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main id="view-list" class="view">
    <header class="appbar">
      <h1 class="title">Nôm Notes</h1>
      <span id="lang-switch" class="lang-switch" role="group" aria-label="Language" data-vi-aria-label="Ngôn ngữ"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="vi" lang="vi">VI</button></span>
      <button id="search-toggle" class="icon-btn" type="button" aria-label="Search" data-vi-aria-label="Tìm kiếm"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button id="list-menu-btn" class="icon-btn" type="button" aria-label="Menu" data-vi-aria-label="Menu" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div id="list-menu" class="menu" hidden>
        <button id="account-btn" type="button"><i class="fa-solid fa-user"></i> <span id="account-label" data-vi="Đăng nhập để đồng bộ">Sign in to sync</span></button>
        <button id="sync-now" type="button" hidden><i class="fa-solid fa-rotate"></i> <span data-vi="Đồng bộ ngay">Sync now</span></button>
        <div class="menu-sep" role="separator"></div>
        <button id="export" type="button"><i class="fa-solid fa-file-export"></i> <span data-vi="Xuất ghi chú">Export notes</span></button>
        <button id="import" type="button"><i class="fa-solid fa-file-import"></i> <span data-vi="Nhập ghi chú">Import notes</span></button>
        <button id="font-list" type="button"><i class="fa-solid fa-font"></i> <span data-vi="Phiên bản phông chữ">Font versions</span></button>
        <button id="update-check" type="button"><i class="fa-solid fa-arrows-rotate"></i> <span data-vi="Kiểm tra cập nhật">Check for updates</span></button>
        <div id="version" class="menu-version"></div>
      </div>
    </header>
    <div id="search-bar" class="search-bar" hidden><input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Search" data-vi-aria-label="Tìm kiếm" placeholder="Search" data-vi-placeholder="Tìm kiếm"></div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <ul id="notes" class="notes"></ul>
    <p id="empty" class="empty" hidden data-vi="Chưa có ghi chú">No notes yet</p>
    <p id="no-results" class="empty" hidden data-vi="Không có ghi chú phù hợp">No matching notes</p>
    <button id="new-note" class="fab" type="button" aria-label="New note" data-vi-aria-label="Ghi chú mới"><i class="fa-solid fa-plus"></i></button>
  </main>
  <section id="view-editor" class="view" hidden>
    <header class="appbar">
      <button id="back" class="icon-btn" type="button" aria-label="Back" data-vi-aria-label="Quay lại"><i class="fa-solid fa-arrow-left"></i></button>
      <a id="home-logo" class="home-logo" href="https://chunom.org/" hidden aria-label="Chunom" title="chunom.org"><img src="icons/icon-192.png" alt="" width="36" height="36"></a>
      <button id="undo-btn" class="bar-btn" type="button" disabled aria-label="Undo" data-vi-aria-label="Hoàn tác" title="Undo" data-vi-title="Hoàn tác"><span class="uni" aria-hidden="true">↶</span></button>
      <button id="redo-btn" class="bar-btn" type="button" disabled aria-label="Redo" data-vi-aria-label="Làm lại" title="Redo" data-vi-title="Làm lại"><span class="uni" aria-hidden="true">↷</span></button>
      <span class="grow"></span>
      <input id="read-zoom" class="read-zoom" type="range" min="50" max="300" step="any" value="100" autocomplete="off" aria-label="Zoom" data-vi-aria-label="Thu phóng">
      <span class="grow"></span>
      <button id="keep-btn" class="icon-btn" type="button" hidden aria-label="Add to my notes" data-vi-aria-label="Thêm vào ghi chú của tôi" title="Add to my notes" data-vi-title="Thêm vào ghi chú của tôi"><i class="fa-solid fa-copy"></i></button>
      <button id="share-btn" class="icon-btn" type="button" aria-label="Share" data-vi-aria-label="Chia sẻ" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-share-nodes"></i></button>
      <div id="share-menu" class="menu" hidden>
        <button id="share-link" type="button"><i class="fa-solid fa-link"></i> <span data-vi="Chia sẻ liên kết">Share link</span></button>
        <button id="share-end" type="button" hidden><i class="fa-solid fa-link-slash"></i> <span data-vi="Hủy chia sẻ">Stop sharing</span></button>
      </div>
      <button id="edit-btn" class="icon-btn" type="button" aria-label="Edit" data-vi-aria-label="Chỉnh sửa"><i class="fa-solid fa-pencil"></i></button>
      <button id="style-btn" class="style-btn" type="button" aria-label="Style" data-vi-aria-label="Kiểu" aria-haspopup="true" aria-expanded="false"></button>
      <div id="style-menu" class="menu" hidden><div id="set-style" role="radiogroup"></div></div>
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Menu" data-vi-aria-label="Menu" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div id="menu" class="menu" hidden>
        <div id="page-menu"></div>
        <div class="menu-sep" role="separator"></div>
        <label class="menu-row"><span data-vi="QATT">QATT</span><select id="set-decoding" autocomplete="off"></select></label>
        <label class="menu-row"><span data-vi="Phương thức nhập">Input method</span><select id="set-ime" autocomplete="off"><option value="telex">Telex</option><option value="off" data-vi="Không Telex">No Telex</option></select></label>
        <div class="menu-sep" role="separator"></div>
        <button id="menu-delete" type="button"><i class="fa-solid fa-trash"></i> <span data-vi="Xóa">Delete</span></button>
        <div class="menu-group"><span class="menu-label" data-vi="Phông chữ">Font</span><div id="set-font" role="radiogroup"></div></div>
      </div>
    </header>
    <div id="fmtbar" class="fmtbar" role="toolbar" aria-label="Format" data-vi-aria-label="Định dạng">
      <span id="toolbar" class="tools"></span>
      <select id="set-size" class="ime-select size-select" autocomplete="off" aria-label="Font size" data-vi-aria-label="Cỡ chữ" title="Font size" data-vi-title="Cỡ chữ"><optgroup label="Font size" data-vi-label="Cỡ chữ"><option value="14">14px</option><option value="16">16px</option><option value="18">18px</option><option value="20">20px</option><option value="24">24px</option><option value="28">28px</option><option value="32">32px</option><option value="36">36px</option><option value="48">48px</option><option value="72">72px</option><option value="96">96px</option></optgroup></select>
      <span id="page-tools" class="page-tools"></span>
    </div>
    <div id="field" class="field">
      <div class="doc-head">
        <div id="editor-title" class="doc-title" role="button" tabindex="0" aria-label="Title" data-vi-aria-label="Tiêu đề"></div>
        <input id="title-input" class="doc-title" type="text" hidden autocomplete="off" spellcheck="false" aria-label="Title" data-vi-aria-label="Tiêu đề" placeholder="Title" data-vi-placeholder="Tiêu đề">
      </div>
      <div id="editor"></div>
    </div>
    <div id="keybar" class="keybar" hidden>
      <span class="variants" role="group" aria-label="Chữ Nôm candidates and variants of the characters before the cursor" data-vi-aria-label="Gợi ý Chữ Nôm và biến thể của các ký tự trước con trỏ"><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button type="button" class="variant" disabled>·</button><button id="nom-more-btn" type="button" class="more" disabled aria-expanded="false" aria-controls="nom-more" aria-label="More Chữ Nôm candidates" data-vi-aria-label="Thêm gợi ý Chữ Nôm" title="More Chữ Nôm candidates" data-vi-title="Thêm gợi ý Chữ Nôm"><i class="fa-solid fa-caret-up"></i></button></span>
      <div id="nom-more" class="nom-more" hidden></div>
      <div id="symbolbar" class="symbolbar" role="group" aria-label="Special characters" data-vi-aria-label="Ký tự đặc biệt"></div>
    </div>
  </section>
  <div id="fontinfo" class="clip" hidden>
    <div class="clip-sheet" role="dialog" aria-modal="true" aria-labelledby="fontinfo-title">
      <div id="fontinfo-title" class="clip-title"></div>
      <div class="clip-body"><ul id="fontinfo-list" class="fontinfo-list"></ul></div>
      <div class="clip-actions">
        <button id="fontinfo-close" type="button"><i class="fa-solid fa-xmark"></i> <span data-vi="Đóng">Close</span></button>
      </div>
    </div>
  </div>
  <div id="snackbar" class="snackbar" role="status" hidden><span id="snackbar-text"></span> <button id="undo" type="button" hidden data-vi="Hoàn tác">Undo</button></div>
</body>
</html>
